  <title>Alier Pong</title>

  <div id="game-root">
    <div class="bg-blobs">
      <div class="blob-1"></div>
      <div class="blob-2"></div>
    </div>
    <div class="dot-grid-overlay"></div>

    <div class="hud">

        <div id="score" class="score">00</div>
      </div>
    </div>

      <canvas id="game-canvas"></canvas>

      <div id="idle-overlay" class="overlay idle">
        <div class="waiting-hint">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"
            stroke-linecap="round" stroke-linejoin="round">
            <polygon points="5 3 19 12 5 21 5 3"></polygon>
          </svg>
          Mueve el joystick para jugar...
        </div>

              <div class="divider"></div>

              Waiting for Input
            </div>
          </div> -->
      </div>

      <div id="gameover-overlay" class="overlay gameover hidden">
        <div class="gameover-content">
          Por cada 
          <div class="final-score">0</div> envases,</br> ALIER recycla <div class="final-score">0</div> envases <br>
          <p> en <span id="polyAl">0</span>kg de polyAL y <span id="papel">0</span>kg de Papel.</p>
          <div class="timer-container">
            <div class="progress-bar">
              <div id="progress-fill" class="progress-fill"></div>
            </div>
            <span id="timer-text" class="timer-text">Reiniciando en 10s</span>
          </div>
        </div>

    <div class="edge-glow"></div>
