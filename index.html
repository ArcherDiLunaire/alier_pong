<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Google AI Studio App</title>
  </head>
  <body>
    <div id="game-root">
      <div class="bg-blobs">
        <div class="blob-1"></div>
        <div class="blob-2"></div>
      </div>
      <div class="dot-grid-overlay"></div>
      
      <div class="hud">
        <div class="score-container">
          <span class="label">Center Crossings</span>
          <div id="score" class="score">00</div>
        </div>
      </div>

      <div class="canvas-container" id="canvas-container">
        <canvas id="game-canvas"></canvas>

        <div id="idle-overlay" class="overlay idle">
          <div class="card">
            <h1>DUAL PONG</h1>
            <div class="controls-grid">
              <div class="control-item">
                <div class="key-hint">WASD</div>
                <p class="p1">Player 1</p>
              </div>
              <div class="divider"></div>
              <div class="control-item">
                <div class="key-hint">ARROWS</div>
                <p id="p2-hint" class="p2">BOT ASSIST</p>
              </div>
            </div>
            <p class="description">
              Two balls. High speed. Pure reflex.<br />
              <span class="italic-hint">Press any movement key to begin.</span>
            </p>
            <div class="waiting-hint">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
              Waiting for Input
            </div>
          </div>
        </div>

        <div id="gameover-overlay" class="overlay gameover hidden">
          <div class="gameover-content">
            <div class="label">Game Over</div>
            <div id="final-score" class="final-score">0</div>
            <div class="timer-container">
              <div class="progress-bar">
                <div id="progress-fill" class="progress-fill"></div>
              </div>
              <span id="timer-text" class="timer-text">Restarting in 8s</span>
            </div>
          </div>
        </div>
      </div>

      <div class="edge-glow"></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
